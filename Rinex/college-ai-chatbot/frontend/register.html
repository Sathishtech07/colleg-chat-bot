<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — SIT College AI Chatbot</title>

  <!-- Google Fonts & Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVIGATION BAR -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">SIT <span>Chatbot</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="chatbot.html" class="nav-link">Chatbot</a>
        <a href="departments.html" class="nav-link">Departments</a>
        <a href="faculty.html" class="nav-link">Faculty</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="college-info.html" class="nav-link">College Info</a>
        <a href="admin-login.html" class="nav-link nav-admin-btn">🔑 Admin</a>
        <div id="nav-auth" style="display: inline-flex; gap: 10px; align-items: center;">
          <a href="login.html" class="nav-link">Login</a>
          <a href="register.html" class="nav-link active btn-nav">Register</a>
        </div>
      </div>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- REGISTRATION SECTION -->
  <main class="auth-page">
    <div class="container">
      <div class="auth-container">
        
        <div class="auth-card">
          <div class="auth-header text-center">
            <div class="auth-icon">📝</div>
            <h2>Create Student Account</h2>
            <p>Register with your email to start asking questions to the College AI Bot.</p>
          </div>

          <!-- Alert element -->
          <div id="register-alert" class="alert hidden"></div>

          <!-- Registration Form -->
          <form id="register-form">
            <div class="form-group">
              <label for="fullname">Full Name</label>
              <input type="text" id="fullname" name="fullname" class="form-control" placeholder="e.g. Rahul Sharma" required autocomplete="name">
            </div>

            <div class="form-group">
              <label for="email">College Email Address</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="e.g. rahul@sit.edu" required autocomplete="email">
            </div>

            <div class="form-group">
              <label for="password">Password (Min. 6 characters)</label>
              <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <div class="form-group">
              <label for="confirm_password">Confirm Password</label>
              <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit" id="register-btn" class="btn btn-primary btn-block btn-lg">
              ✨ Register Account
            </button>
          </form>

          <div class="auth-footer text-center">
            <p>Already have an account? <a href="login.html">Login Here</a></p>
          </div>

        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container text-center">
      <p>© 2026 Sunrise Institute of Technology. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
